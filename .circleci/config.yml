version: 2.1

functions:
  setup-node: github.com/circleci-functions/setup-node@v0.4.0

jobs:
  test:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup-node:
          with:
            node-version: "22"
      - setup-node/install-packages
      - run:
          name: Run tests
          command: npm test

  deploy:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup-node:
          with:
            node-version: "22"
      - setup-node/install-packages
      - run:
          name: Deploy to Cloudflare Workers (dry run)
          command: npx wrangler deploy --dry-run --outdir dist

workflows:
  test:
    jobs:
      - test
      - deploy:
          requires:
            - test
