version: 2.1

jobs:
  locate-22:
    docker:
      - image: cimg/node:22-browsers
    steps:
      - run:
          name: Locate browsers
          command: |
            set +e
            echo IMAGE=cimg/node:22-browsers
            which google-chrome google-chrome-stable chromium chromium-browser 2>/dev/null
            ls -la /opt/google/chrome/ 2>/dev/null || echo 'no /opt/google/chrome'
            ls /usr/bin/*chrome* 2>/dev/null || true
            dpkg -l 2>/dev/null | grep -iE 'chrome|chromium' || true
            google-chrome --version 2>/dev/null || google-chrome-stable --version 2>/dev/null || true
  locate-current:
    docker:
      - image: cimg/node:current-browsers
    steps:
      - run:
          name: Locate browsers
          command: |
            set +e
            echo IMAGE=cimg/node:current-browsers
            which google-chrome google-chrome-stable chromium chromium-browser 2>/dev/null
            ls -la /opt/google/chrome/ 2>/dev/null || echo 'no /opt/google/chrome'
            ls /usr/bin/*chrome* 2>/dev/null || true
            dpkg -l 2>/dev/null | grep -iE 'chrome|chromium' || true
            google-chrome --version 2>/dev/null || google-chrome-stable --version 2>/dev/null || true
  e2e-22:
    docker:
      - image: cimg/node:22-browsers
    steps:
      - checkout
      - run: npm ci
      - run: npm run test:e2e

workflows:
  test:
    jobs:
      - locate-22
      - locate-current
      - e2e-22
